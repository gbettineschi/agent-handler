name: Package macOS app
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: bash scripts/test.sh
      - name: Build universal app archive
        env:
          APP_UNIVERSAL: '1'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            export APP_VERSION="${GITHUB_REF_NAME#v}"
          fi
          bash scripts/package.sh
          for arch in arm64 x86_64; do
            lipo 'dist/Agent Handler.app/Contents/MacOS/AgentHandler' -verify_arch "$arch"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: AgentHandler-macOS
          path: |
            dist/AgentHandler.zip
            dist/SHA256SUMS
            dist/agent-handler.rb
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/AgentHandler.zip dist/SHA256SUMS dist/agent-handler.rb \
            --verify-tag --title "Agent Handler ${GITHUB_REF_NAME#v}" \
            --notes '100% vibe-coded for personal use. Provided as is. macOS 14+, Apple silicon and Intel. This build is ad-hoc signed and not notarized.'
  tap:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    uses: gbettineschi/homebrew-tap/.github/workflows/publish.yml@main
    with:
      package: agent-handler
      tag: ${{ github.ref_name }}
    secrets:
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
