name: macOS verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Synthetic tests
        run: scripts/test.sh
      - name: Offscreen UI matrix
        run: bash scripts/render-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-ui-renders
          path: .build/ui-snapshots/*.png
          if-no-files-found: ignore
      - name: Development bundle
        run: scripts/bundle.sh
      - name: Controller demo
        run: .build/debug/AgentHandlerDiagnostics --demo
      - name: Verify ad-hoc signature
        run: codesign --verify --deep --strict 'dist/Agent Handler.app'
